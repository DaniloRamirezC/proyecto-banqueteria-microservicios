services:
  postgres-catalogo:
    image: postgres:16-alpine
    container_name: postgres-catalogo
    restart: unless-stopped
    environment:
      POSTGRES_DB: bd_catalogo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - service_catalogo_data:/var/lib/postgresql/data
volumes:
  service_catalogo_data:
