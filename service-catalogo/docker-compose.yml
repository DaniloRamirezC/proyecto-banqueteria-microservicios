services:
  postgres-catalogo:
    image: postgres:16-alpine
    container_name: postgres-catalogo
    restart: unless-stopped
    environment:
      POSTGRES_DB: bd_catalogo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - service_catalogo_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bd_admin"]
      interval: 5s
      timeout: 5s
      retries: 10

  catalogo-api:
    build: .
    container_name: catalogo-api
    restart: unless-stopped
    depends_on:
      postgres-catalogo:
        condition: service_healthy
    env_file: .env
    environment:
      DB_HOST: postgres-catalogo
      DB_PORT: "5432"
      PORT: "8081"
    ports:
      - "8081:8081"

volumes:
  service_catalogo_data:
