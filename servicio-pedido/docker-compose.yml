services:
  postgres-pedido:
    image: postgres:16-alpine
    container_name: postgres-pedido
    restart: always
    environment:
      POSTGRES_DB: bd_pedido
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"
    volumes:
      - postgres_pedido_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bd_pedido"]
      interval: 5s
      timeout: 5s
      retries: 10
  
  pedido-api:
    build: .
    container_name: pedido-api
    restart: always
    depends_on:
      postgres-pedido:
        condition: service_healthy
    env_file: .env
    environment:
      DB_HOST: postgres-pedido
      DB_PORT: "5432"
      PORT: "8083"
    ports:
      - "8083:8083"

volumes:
  postgres_pedido_data: