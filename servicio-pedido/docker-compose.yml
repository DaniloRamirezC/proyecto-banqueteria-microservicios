services:
  postgres-pedido:
    image: postgres:18-alpine
    container_name: postgres-pedido
    restart: always
    environment:
      POSTGRES_DB: bd_pedido
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"
    volumes:
      - postgres_pedido_data:/var/lib/postgresql/data

volumes:
  postgres_pedido_data: